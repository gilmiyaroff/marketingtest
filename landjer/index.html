.hero-content{position:relative;z-index:2;max-width:620px;color:#fff;padding:48px 42px}.eyebrow{display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#d9e8df;margin-bottom:12px}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.02;margin:0 0 12px;letter-spacing:-.04em}.hero p{margin:0 0 24px;color:#e3ece7;font-size:18px;max-width:530px}.hero-actions{display:flex;gap:12px;flex-wrap:wrap}.btn{border:none;border-radius:16px;padding:14px 20px;font-weight:700}.btn-primary{background:#fff;color:var(--green)}.btn-secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.24)}
main{padding:10px 0 80px}.panel{background:var(--card);border:1px solid var(--stroke);border-radius:26px;box-shadow:var(--shadow);padding:24px}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}.progress{display:flex;gap:6px}.progress span{width:34px;height:6px;background:#e8ece6;border-radius:999px}.progress span.active{background:var(--green2)}
.quiz-title{font-size:clamp(26px,4vw,40px);line-height:1.1;letter-spacing:-.04em;margin:10px 0 8px}.quiz-sub{color:var(--muted);margin:0 0 20px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.options.four{grid-template-columns:repeat(4,minmax(0,1fr))}.option{background:#fff;border:1px solid var(--stroke);border-radius:22px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-height:210px;transition:.18s ease}.option:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(16,59,42,.10);border-color:#cbd8cd}.option-image{height:122px;background:#d8e4da center/cover no-repeat}.option-body{padding:16px}.option-title{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}.option-sub{display:block;color:var(--muted);font-size:14px}
.option.simple{min-height:unset;padding:18px}.option.simple .option-title{font-size:18px}.quiz-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}.text-btn{border:none;background:none;color:var(--green2);font-weight:700;padding:8px 4px}

[hidden]{display:none!important}
body.plot-inner .hero{display:none}
body.plot-inner main{padding-top:18px}
body.plot-inner .map-head,body.plot-inner .section-head{margin-top:10px}
#map .map-layout{grid-template-columns:1fr}
#map .canvas{overflow-x:auto}
#map .canvas svg{min-width:650px}
#map .lot-chip:hover{border-color:#6b9e80;background:#eaf4ed}
#map .plot:focus-visible{stroke:#cba75f;stroke-width:6;outline:0}
.plot-page{padding:0 0 65px}

.plot-breadcrumb button{border:0;background:none;color:var(--green);font-weight:800;padding:8px 0}
.plot-columns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(310px,.8fr);gap:19px;align-items:start}
.plot-panel,.plot-details{background:#fff;border:1px solid var(--stroke);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.plot-photo{height:clamp(265px,32vw,420px);background-size:cover;background-position:center;position:relative}
.plot-photo:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(5,37,22,.55))}
.plot-photo-label{position:absolute;bottom:21px;left:23px;color:white;font-weight:800;font-size:21px;z-index:1}
.plot-photo-note{position:absolute;top:17px;left:18px;z-index:1;background:#fffffff0;border-radius:100px;padding:8px 13px;color:var(--green);font-size:12px;font-weight:800}
.plot-mainbody{padding:26px}
.plot-mainbody h2{font-size:26px;letter-spacing:-.03em;margin:0 0 12px}
.plot-mainbody p{color:var(--muted);line-height:1.65;margin:0}
.plot-mini-map{background:#dbe8d7;border:1px solid #d8e2d3;border-radius:17px;overflow:auto;margin-top:18px}
.plot-mini-map svg{min-width:460px}
.plot-details{position:sticky;top:96px}
.plot-details .detail-topimg{height:0}
.plot-details .detail-body{padding:27px}
.plot-details .detail-title{font-size:35px;line-height:1.05}
.plot-details .price{font-size:39px}

.plot-details .detail-actions button:first-child{background:var(--green);color:#fff}
.plot-details .detail-actions button:last-child{background:#fff;color:var(--green);border:1px solid #d4e1d5}
.plot-details .detail-actions button:disabled{background:#bfc9c0;color:#fff;cursor:default}
.plot-note{font-size:12px;color:#78867d;line-height:1.5;margin-top:11px}

.plot-similar h3{font-size:23px;letter-spacing:-.03em}

.plot-similar-grid button:hover{background:#ecf4eb;border-color:#83ad8e}
.plot-similar-grid strong{display:block;color:var(--green);font-size:19px;margin-top:10px}

.plot-demo-body h2{margin:0 0 12px}
.plot-demo-body p{color:#64766a;line-height:1.6}

/* Homepage: the first quiz answer is a visual choice, not a duplicate CTA */
.hero-card{min-height:0}
.hero-content{max-width:100%;padding:38px 40px 36px}
.hero h1{max-width:720px;font-size:clamp(34px,5vw,55px);margin-bottom:12px}
.hero p{max-width:660px;font-size:16px;margin-bottom:24px;line-height:1.5}
.home-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:870px}
.home-choice{display:block;position:relative;isolation:isolate;min-height:207px;overflow:hidden;padding:0;background:#315b45;color:white;border:1px solid #ffffff52;border-radius:20px;text-align:left;box-shadow:0 9px 22px #09281744}
.home-choice-photo{position:absolute;inset:0;background-position:center;background-size:cover;z-index:-2;transition:transform .25s ease}
.home-choice:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#061a1022 10%,#03140ae6 100%);z-index:-1}
.home-choice-content{position:absolute;left:19px;right:18px;bottom:17px}
.home-choice-title{display:block;font-size:clamp(20px,2.4vw,27px);font-weight:820;line-height:1.1;letter-spacing:-.025em}
.home-choice-caption{display:block;margin-top:7px;font-size:13px;color:#e5f0e9}
.home-choice-arrow{position:absolute;right:17px;top:15px;display:grid;place-items:center;width:31px;height:31px;border-radius:50%;font-size:20px;background:#ffffffde;color:#17442f}
.home-choice:hover .home-choice-photo{transform:scale(1.045)}
.home-choice:hover{border-color:#e4c78d}
.home-choice:focus-visible{outline:3px solid #e4c78d;outline-offset:3px}
@media(max-width:700px){
.hero{padding:13px 0 18px}
.hero-card{min-height:0;border-radius:22px}
.hero-content{padding:25px 18px 18px}
.hero h1{font-size:clamp(30px,8vw,41px);line-height:1.08;margin-bottom:10px}
.hero p{font-size:14px;line-height:1.4;margin-bottom:18px}
.hero .eyebrow{font-size:10px;letter-spacing:.13em}
.home-choices{gap:9px}
.home-choice{min-height:174px;border-radius:15px}
.home-choice-content{left:12px;right:10px;bottom:13px}

.home-choice-arrow{right:10px;top:10px;width:25px;height:25px;font-size:17px}
}
@media(max-width:380px){.home-choice{min-height:160px}.home-choice-title{font-size:17px}.home-choice-caption{font-size:10px}}

.map-stage{overflow:auto;border-radius:14px;background:#d9e5d3}
.map-zoom{display:flex;align-items:center;gap:5px}
.map-zoom button{border:1px solid #d2dfd4;background:#f5faf5;width:34px;height:34px;border-radius:10px;color:#22563c;font-size:21px;line-height:1}
.map-zoom button:hover{background:#e6f3e8}
.map-zoom span{min-width:43px;text-align:center;font-size:12px;color:#5c7867}
.plot{transition:fill .15s,stroke .15s;stroke-linejoin:round}

.plot-number{font:800 17px system-ui,sans-serif;fill:#fff;pointer-events:none;text-anchor:middle}

.plan-caption{font:620 12px system-ui,sans-serif;fill:#698577}

/* Plot page: map first, property price/details second, house ideas third */
.plot-layout-sequential{display:flex;flex-direction:column;gap:20px}

.plot-layout-sequential .plot-info-order>.eyebrow{display:block;margin:0 0 10px 8px;font-size:11px}

.plot-layout-sequential{gap:18px}

}

/* LANDJER home: two vertically stacked, full-width choices */
.hero-image{display:none}
.hero-card{background:var(--green);min-height:0}
.hero-content{max-width:100%;width:100%;padding:32px 34px 34px}
.hero h1{font-size:clamp(31px,3.8vw,47px);margin:0 0 8px}

.home-choices{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(210px,1fr));max-width:100%;width:100%;gap:14px}
.home-choice{width:100%;min-height:210px;border-radius:20px}
.home-choice-content{left:23px;bottom:23px}

.home-choice-caption{font-size:14px}

.plot-overview-grid .plot-details .detail-zone{font-size:13px;margin-bottom:7px}
.plot-overview-grid .plot-details .price{font-size:clamp(29px,3.3vw,38px);margin-bottom:12px}

.plot-overview-grid .plot-details .plot-note{font-size:11px;margin-top:9px}

function buildLots(zone){
  const sizesLife=[5.5,6,6.5,7,8,9,10,12,14];
  const sizesBiz=[8,10,12,14,16,18,22,28,35];
  const base=zone.type==='life'?sizesLife:sizesBiz;
  const lots=[];
  for(let i=0;i<12;i++){
    const area=base[(i*5+Math.floor(i/9))%base.length];
    const premium=(i%4)*0.35 + (zone.where==='far'?1.1:.2);
    const price=+(zone.priceFrom + (area-base[0])*(zone.type==='business' ? 0.48 : 0.28) + premium).toFixed(1);
    let status='available';
    if(i===2||i===9) status='booked';
    if(i===5||i===10) status='sold';
    lots.push({id:`${zone.lotsSeed}-${101+i}`,area,price,status,electric:zone.amenities.electric&&(i!==3),water:zone.amenities.water&&(i!==7),road:zone.amenities.road});
  }
  return lots;
}

function sizeOptions(){
  if(answers.purpose==='business'){
    return [
      {id:'small', title:'До 10 соток', sub:'Компактный формат'},
      {id:'medium', title:'10–20 соток', sub:'Средняя площадь'},
      {id:'large', title:'Больше 20 соток', sub:'Просторный участок'},
      {id:'any', title:'Пока не знаю', sub:'Покажите разные варианты'}
    ];
  }
  return [
    {id:'small', title:'До 6 соток', sub:'Небольшой участок'},
    {id:'medium', title:'6–10 соток', sub:'Самый популярный размер'},
    {id:'large', title:'Больше 10 соток', sub:'Больше пространства'},
    {id:'any', title:'Пока не знаю', sub:'Покажите разные варианты'}
  ];
}
function fmtPrice(v){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1,minimumFractionDigits:v%1?1:0}).format(v)+' млн ₸'}
function answerChips(){
  const items=[];
  if(answers.purpose==='life') items.push('Для жизни');
  if(answers.purpose==='business') items.push('Для бизнеса');
  if(answers.where==='near') items.push('Рядом с Астаной');
  if(answers.where==='far') items.push('Бурабай');
  if(answers.size==='small') items.push(answers.purpose==='business'?'До 10 соток':'До 6 соток');
  if(answers.size==='medium') items.push(answers.purpose==='business'?'10–20 соток':'6–10 соток');
  if(answers.size==='large') items.push(answers.purpose==='business'?'>20 соток':'>10 соток');
  if(answers.plan==='soon') items.push('Скоро строить');
  if(answers.plan==='later') items.push('Позже');
  if(answers.plan==='invest') items.push('Инвестиция');
  return items.map(i=>`<span class="chip">${i}</span>`).join('');
}
function filteredZones(){
  return zones.filter(z => (!answers.purpose || z.type===answers.purpose) && (!answers.where || answers.where==='any' || z.where===answers.where));
}
function sizeMatch(area){
  if(!answers.size || answers.size==='any') return true;
  if(answers.purpose==='business'){
    if(answers.size==='small') return area<=10;
    if(answers.size==='medium') return area>10 && area<=20;
    return area>20;
  }
  if(answers.size==='small') return area<=6;
  if(answers.size==='medium') return area>6 && area<=10;
  return area>10;
}
function rankLots(lots){
  const arr=lots.filter(l=>sizeMatch(l.area));
  return arr.sort((a,b)=>{
    if(answers.plan==='invest') return (a.price/a.area)-(b.price/b.area);
    if(answers.plan==='soon') return ((+b.electric)+(+b.water))-((+a.electric)+(+a.water)) || a.price-b.price;
    return a.price-b.price;
  });
}

  document.querySelectorAll('[data-value]').forEach(btn=>btn.onclick=()=>{

}

function bindPlotGallery(){

 const tabs=Array.from(root.querySelectorAll('[data-media-tab]')),panes=Array.from(root.querySelectorAll('[data-media-pane]'));
 let active=0;
 function show(i){
   active=(i+3)%3;
   tabs.forEach((b,n)=>{b.classList.toggle('active',n===active);b.setAttribute('aria-pressed',String(n===active));});
   panes.forEach((p,n)=>p.hidden=n!==active);
   root.querySelector('#galleryCount').textContent=String(active+1).padStart(2,'0')+' / 03';
   const frame=root.querySelector('#plotGeoFrame');
   if(active===2&&frame&&!frame.getAttribute('src'))frame.setAttribute('src',frame.dataset.mapSrc);
 }
 tabs.forEach((b,i)=>b.addEventListener('click',()=>show(i)));
 root.querySelector('#galleryPrev').addEventListener('click',()=>show(active-1));
 root.querySelector('#galleryNext').addEventListener('click',()=>show(active+1));
 let firstTouch=null;const stage=root.querySelector('#galleryStage');
 stage.addEventListener('touchstart',e=>{if(e.touches.length===1&&active!==2)firstTouch=e.touches[0].clientX;},{passive:true});
 stage.addEventListener('touchend',e=>{if(firstTouch===null)return;const d=e.changedTouches[0].clientX-firstTouch;firstTouch=null;if(Math.abs(d)>55)show(active+(d<0?1:-1));},{passive:true});
 root.querySelectorAll('[data-lot]').forEach(el=>{
   el.addEventListener('click',()=>openPlot(el.dataset.lot));
   el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openPlot(el.dataset.lot);}});
 });
 show(0);
}

function route(){
  const p=decodeURIComponent(location.hash.slice(1)).split('/');
  if(p[0]==='lot'&&p.length===3){
    const z=zones.find(x=>x.id===p[1]),l=z&&z.lots.find(x=>x.id===p[2]);
    if(z&&l){ui.currentZone=z;ui.currentLot=l;renderDedicatedPlot();return;}
  }
  if(p[0]==='zone'&&p.length===2){
    const z=zones.find(x=>x.id===p[1]);
    if(z){
      ui.currentZone=z;
      // Reinitialize when entering a different zone; never reuse another zone's lot.
      const available=rankLots(z.lots.filter(l=>l.status==='available'));
      ui.currentLot=available[0] || z.lots[0] || null;
      renderMap();return;
    }
  }
  if(p[0]==='zones'){renderZones();return;}
  if(p[0]==='quiz'&&answers.purpose&&ui.step>=1){renderQuiz();return;}
  // The homepage handles question 1; don't repeat it below the hero.
  setScreen('home');
  ui.step=0;
  window.scrollTo(0,0);
}

function setupMapZoom(){

 if(!svg||!label)return;
 const update=()=>{
  svg.style.width=(factor*100)+"%";
  svg.style.maxWidth="none";
  label.textContent=Math.round(factor*100)+"%";
 };
 document.getElementById("mapZoomIn").onclick=()=>{factor=Math.min(2,Math.round((factor+.25)*100)/100);update();};
 document.getElementById("mapZoomOut").onclick=()=>{factor=Math.max(1,Math.round((factor-.25)*100)/100);update();};
 update();
}
