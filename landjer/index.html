function getZone(id){return config.find(function(x){return x.id===id})}
function getLot(z,id){return z&&z.lots.find(function(l){return l.id===id})}
function price(p){return new Intl.NumberFormat("ru-RU",{minimumFractionDigits:p%1?1:0,maximumFractionDigits:1}).format(p)+" млн ₸"}
function statusText(v){return v==="available"?"Свободен":v==="booked"?"Забронирован":"Продан"}
function sizeMatch(l){
 if(!answers.size||answers.size==="any")return true;
 if(answers.purpose==="business")return answers.size==="small"?l.area<=10:answers.size==="medium"?l.area>10&&l.area<=20:l.area>20;
 return answers.size==="small"?l.area<=6:answers.size==="medium"?l.area>6&&l.area<=10:l.area>10;
}
function matchesZone(z){
 return (!answers.purpose||answers.purpose==="any"||z.purpose===answers.purpose)&&(!answers.distance||answers.distance==="any"||z.distance===answers.distance);
}
function availableLots(z){return z.lots.filter(function(l){return l.status==="available" && sizeMatch(l)})}
function preferredLots(z){
 return availableLots(z).sort(function(a,b){
   if(answers.timing==="invest")return (a.price/a.area)-(b.price/b.area);
   if(answers.timing==="soon")return (+b.water+ +b.electric)-(+a.water+ +a.electric)||a.price-b.price;
   return a.price-b.price;
 });
}
function steps(){
 return [
 {heading:"Для чего вам участок?",hint:"Начнём с самого важного",options:[{id:"life",title:"Для жизни",sub:"Дом или загородный отдых",icon:"home"},{id:"business",title:"Для бизнеса",sub:"Коммерческий объект или проект",icon:"business"}]},
 {heading:"Где хотите приобрести землю?",hint:"Выберите комфортное расположение",options:[{id:"near",title:"Рядом с Астаной",sub:"Косшы и Каражар",icon:"pin"},{id:"far",title:"Подальше от города",sub:"Бурабай",icon:"trees"},{id:"any",title:"Рассмотрю всё",sub:"Место не принципиально",icon:"layers"}]},
 {heading:"Сколько земли вам нужно?",hint:"Выберите примерную площадь",options:answers.purpose==="business"?[{id:"small",title:"До 10 соток",sub:"Компактный участок",icon:"small"},{id:"medium",title:"10–20 соток",sub:"Средняя площадь",icon:"medium"},{id:"large",title:"Больше 20 соток",sub:"Просторный участок",icon:"large"},{id:"any",title:"Пока не знаю",sub:"Покажите варианты",icon:"question"}]:[{id:"small",title:"До 6 соток",sub:"Компактный участок",icon:"small"},{id:"medium",title:"6–10 соток",sub:"Оптимальный размер",icon:"medium"},{id:"large",title:"Больше 10 соток",sub:"Много пространства",icon:"large"},{id:"any",title:"Пока не знаю",sub:"Покажите варианты",icon:"question"}]},
 {heading:answers.purpose==="business"?"Когда планируете запускать проект?":"Когда планируете строить?",hint:"Учтём ваши планы при подборе",options:[{id:"soon",title:answers.purpose==="business"?"В ближайшее время":"В ближайшее время",sub:"Хочу приступить скоро",icon:"hammer"},{id:"later",title:"Позже",sub:"Покупка на перспективу",icon:"calendar"},{id:"invest",title:"Для инвестиций",sub:"Рассматриваю вложение",icon:"trend"}]}
 ];
}
function smallIntroSVG(){
 return '<svg viewBox="0 0 280 200" aria-hidden="true"><rect width="280" height="200" fill="#dce7d3"/><path d="M0 42 280 8M0 167 280 123" stroke="#f7f8ec" stroke-width="26"/><path d="M85 0v200M199 0v200" stroke="#f7f8ec" stroke-width="20"/><g fill="#aecfa8" stroke="#fff" stroke-width="3"><rect x="7" y="62" width="68" height="85" rx="6"/><rect x="103" y="46" width="80" height="105" rx="6"/><rect x="216" y="36" width="55" height="89" rx="6"/></g><rect x="112" y="54" width="62" height="89" rx="6" fill="#16523a" stroke="#e4bd77" stroke-width="4"/><path d="m128 98 12 12 22-26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>';
}
function topIntro(){return '<section class="intro-top"><div><div class="eyebrow">Персональный подбор земли</div><h1 class="intro-title">Найдите участок<br>под ваши планы.</h1><p class="intro-description">Четыре вопроса — и только подходящие варианты.</p></div><div class="intro-figure">'+smallIntroSVG()+'</div></section>'}
function quiz(){
 state.view="quiz";var s=steps()[state.step];var idx=state.step;
 var opts=s.options.map(function(o){return '<button class="answer" type="button" data-answer="'+o.id+'"><span class="answer-icon">'+icon(o.icon)+'</span><span class="answer-content"><span class="answer-title">'+o.title+'</span><span class="answer-hint">'+o.sub+'</span></span></button>'}).join("");
 root.innerHTML='<div class="layout intro-wrap">'+topIntro()+'<div class="quiz-shell"><div class="quiz-top"><span class="step-label">Шаг '+(idx+1)+' из 4</span><span class="step-line">'+[0,1,2,3].map(function(i){return '<i class="'+(i<=idx?"active":"")+'"></i>'}).join("")+'</span></div><h2 class="quiz-title">'+s.heading+'</h2><p class="quiz-hint">'+s.hint+'</p><div class="options '+(idx===3?"triple":"")+'">'+opts+'</div><div class="quiz-bottom">'+(idx>0?'<button type="button" class="text-btn" id="prevQuiz">← Назад</button>':'<span></span>')+'<button type="button" class="text-btn skip" id="skipQuiz">Смотреть все участки →</button></div></div></div>';
 root.querySelectorAll("[data-answer]").forEach(function(b){b.addEventListener("click",function(){answers[["purpose","distance","size","timing"][idx]]=b.dataset.answer;if(idx<3){state.step=idx+1;quiz()}else{state.step=0;showZones()}window.scrollTo({top:0,behavior:"smooth"})})});
 var prev=document.getElementById("prevQuiz");if(prev)prev.addEventListener("click",function(){state.step--;quiz()});
 document.getElementById("skipQuiz").addEventListener("click",function(){answers={purpose:"any",distance:"any",size:"any",timing:"later"};showZones()});
}
function chips(){
 var a=[];
 if(answers.purpose&&answers.purpose!=="any")a.push(answers.purpose==="life"?"Для жизни":"Для бизнеса");
 if(answers.distance&&answers.distance!=="any")a.push(answers.distance==="near"?"Рядом с Астаной":"Бурабай");
 if(answers.size&&answers.size!=="any")a.push(answers.purpose==="business"?(answers.size==="small"?"До 10 соток":answers.size==="medium"?"10–20 соток":">20 соток"):(answers.size==="small"?"До 6 соток":answers.size==="medium"?"6–10 соток":">10 соток"));
 if(answers.timing==="soon")a.push("Строительство скоро");
 if(answers.timing==="invest")a.push("Инвестиции");
 return a.map(function(x){return '<span class="summary-chip">'+x+'</span>'}).join("");
}
function landscape(z){
 var lake=z.theme==="forest"?'<path d="M665-20C610 110 810 180 741 285S590 430 650 510" stroke="#9cc4ca" stroke-width="130" fill="none"/><path d="M665-20C610 110 810 180 741 285S590 430 650 510" stroke="#7fb3bc" stroke-width="80" fill="none"/>':'';
 var trees=z.theme==="forest"?Array.from({length:22},function(_,i){var x=(i*87+54)%930,y=(i*53+68)%520;return '<circle cx="'+x+'" cy="'+y+'" r="'+(14+i%4*4)+'" fill="#537e59" opacity=".38"/>'}).join(""):"";
 var lots=Array.from({length:30},function(_,i){var x=58+(i%10)*90,y=85+Math.floor(i/10)*137;return '<rect x="'+x+'" y="'+y+'" width="77" height="111" rx="5" fill="'+(i%4===0?"#c7d7b7":"#adc9a4")+'" stroke="#f6f8ee" stroke-width="8" opacity=".85"/>'}).join("");
 return '<svg viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="scene-'+z.id+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6e1ce"/><stop offset="1" stop-color="#91b19d"/></linearGradient></defs><rect width="1000" height="520" fill="url(#scene-'+z.id+')"/>'+trees+lots+'<path d="M0 65H1000M0 340H1000" stroke="#f5f4e9" stroke-width="34"/><path d="M340 0v520M730 0v520" stroke="#f4f4e9" stroke-width="30"/>'+lake+'<rect x="440" y="106" width="180" height="211" rx="6" fill="#18553d" stroke="#e3bd79" stroke-width="8" opacity=".95"/><path d="m507 209 39 39 53-74" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/></svg>'
}
function showZones(){
 state.view="zones";var zlist=config.filter(matchesZone).map(function(z){return {zone:z,lots:preferredLots(z)}}).filter(function(x){return x.lots.length>0});
 var cards=zlist.map(function(item){var z=item.zone,low=Math.min.apply(null,item.lots.map(function(l){return l.price}));return '<button class="zone-card" type="button" data-zone="'+z.id+'"><div class="zone-photo">'+landscape(z)+'<span class="zone-ribbon">'+z.tag+'</span></div><div class="zone-body"><span class="zone-city">'+z.place+'</span><span class="zone-name">'+z.name+'</span><div class="zone-stats"><span><span class="zone-count">От</span> <span class="zone-price">'+price(low)+'</span></span><span class="zone-count">'+item.lots.length+' свободно <span class="zone-arrow">→</span></span></div></div></button>'}).join("");
 root.innerHTML='<section class="layout result-section"><div class="result-head"><div><div class="kicker">Ваша подборка</div><h1 class="result-title">Подходящие локации</h1><p class="subtitle">Выберите район, чтобы увидеть участки на карте.</p></div><button class="pill pill-light" type="button" id="restart">'+icon("back")+' Изменить ответы</button></div><div class="filter-summary">'+chips()+'</div>'+(cards?'<div class="zones-grid">'+cards+'</div>':'<div class="empty"><strong>Таких участков пока нет в демо</strong><p>Попробуйте другой размер или расположение.</p><button class="pill" id="restartAlt" type="button">Изменить ответы</button></div>')+'</section>';
 root.querySelectorAll("[data-zone]").forEach(function(b){b.addEventListener("click",function(){enterZone(b.dataset.zone)})});
 document.getElementById("restart").addEventListener("click",restart);
 var alt=document.getElementById("restartAlt");if(alt)alt.addEventListener("click",restart);
}
function restart(){state.step=0;answers={purpose:null,distance:null,size:null,timing:null};quiz();window.scrollTo(0,0)}
function enterZone(id){
 var z=getZone(id);if(!z)return;
 state.view="map";state.zoneId=id;state.availableOnly=true;
 var lots=preferredLots(z);state.lotId=lots.length?lots[0].id:(z.lots.find(function(l){return l.status==="available"})||z.lots[0]).id;
 showMap();window.scrollTo({top:0,behavior:"smooth"});
}
function lotCoords(i){var block=Math.floor(i/6),p=i%6;return {x:94+block*311+(p%2)*117,y:173+Math.floor(p/2)*118,w:105,h:101}}
function svgMap(z){
 var forest=z.theme==="forest";
 var river=forest?'<path d="M900-40q-185 190-65 320t-5 420" stroke="#a2c7cf" stroke-width="125" fill="none"/><path d="M900-40q-185 190-65 320t-5 420" stroke="#7ab2bf" stroke-width="80" fill="none"/>':"";
 var trees=Array.from({length:28},function(_,i){var x=(i*137+28)%1010,y=(i*101+13)%650;return '<circle cx="'+x+'" cy="'+y+'" r="'+(7+i%4*3)+'" fill="#739a6b" opacity=".29"/>'}).join("");
 var roads='<path d="M0 120H1020M0 545H1020" fill="none" stroke="#fcf9e9" stroke-width="59"/><path d="M337 120v425M650 120v425" stroke="#fcf9e9" stroke-width="50"/><path d="M0 120H1020M0 545H1020" stroke="#d4d8c5" stroke-width="2" stroke-dasharray="21 18"/><path d="M337 120v425M650 120v425" stroke="#d4d8c5" stroke-width="2" stroke-dasharray="21 18"/>';
 var selected=getLot(z,state.lotId);
 var filtered=z.lots.map(function(l,i){
  var p=lotCoords(i),isSelected=selected&&selected.id===l.id;
  var faded=(state.availableOnly&&l.status!=="available")||(!sizeMatch(l)&&answers.size!=="any");
  return '<g><rect class="plot '+l.status+(isSelected?' active':'')+(faded?' filtered':'')+'" data-lot="'+l.id+'" tabindex="0" role="button" aria-label="Участок '+l.id+', '+l.area+' соток, '+statusText(l.status)+'" x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="5"/><text class="plot-num'+(isSelected?' active':'')+(faded?' filtered':'')+'" x="'+(p.x+p.w/2)+'" y="'+(p.y+p.h/2-3)+'">'+(101+i)+'</text><text class="plot-num'+(isSelected?' active':'')+(faded?' filtered':'')+'" style="font-size:13px;font-weight:500" x="'+(p.x+p.w/2)+'" y="'+(p.y+p.h/2+17)+'">'+l.area+' сот.</text></g>'
 }).join("");
 var marker=forest?"СОСНОВЫЙ БЕРЕГ":"ЖИЛОЙ МАССИВ";
 return '<svg class="map-svg" viewBox="0 0 1020 670" xmlns="http://www.w3.org/2000/svg" aria-label="Интерактивная схема земельных участков"><rect width="1020" height="670" fill="'+(forest?"#c7dcca":"#d7e5d2")+'"/>'+trees+river+roads+'<text x="86" y="75" font-size="15" fill="#4b7358" font-weight="700" letter-spacing="4">'+marker+'</text><text x="85" y="622" font-size="13" fill="#65826a" letter-spacing="2">СХЕМА ЛОКАЦИИ</text>'+filtered+'</svg>';
}
function utility(title,yes,iconName){return '<div class="utility'+(yes?"":" off")+'">'+icon(iconName)+' '+title+': '+(yes?"есть":"нет")+'</div>'}
function detail(z,l){
 return '<div class="detail-top"><span class="status '+l.status+'">'+statusText(l.status)+'</span><h2 class="detail-title">Участок № '+l.id+'</h2><div class="detail-caption">'+z.name+'</div><div class="price-head">'+price(l.price)+'</div></div><div class="specs"><div><div class="spec-label">Площадь</div><div class="spec-value">'+l.area+' соток</div></div><div><div class="spec-label">Назначение</div><div class="spec-value">'+l.kind+'</div></div><div><div class="spec-label">Расположение</div><div class="spec-value">'+z.place+'</div></div><div><div class="spec-label">Подъезд</div><div class="spec-value">'+l.road+'</div></div></div><div class="utilities"><div class="utilities-title">Коммуникации</div><div class="utility-grid">'+utility("Электричество",l.electric,"bolt")+utility("Водоснабжение",l.water,"drop")+'</div></div><div class="detail-action">'+(l.status==="available"?'<button type="button" class="action-primary" id="bookLot">Записаться на просмотр →</button>':'<p class="detail-unavailable">Этот участок сейчас недоступен для выбора.</p>')+'<p class="detail-subnote">Демонстрационные данные</p></div>'
}
function showMap(){
 var z=getZone(state.zoneId);if(!z)return;
 var lot=getLot(z,state.lotId)||z.lots[0];
 var filtered=z.lots.filter(function(l){return l.status==="available" && sizeMatch(l)});
 var list=filtered.length?filtered.map(function(l){return '<button type="button" data-lot-chip="'+l.id+'" class="lot-pill'+(state.lotId===l.id?' selected':'')+'"><strong>№ '+l.id+'</strong><small>'+l.area+' соток</small><span class="lot-pill-price">'+price(l.price)+'</span></button>'}).join(""):'<span class="other-lots">Нет свободных участков этого размера. Измените критерии подбора.</span>';
 root.innerHTML='<section class="layout result-section"><div class="back-row"><button type="button" class="back-arrow" id="backZones">'+icon("back")+' Все локации</button><span class="crumb">'+z.place+'</span></div><h1 class="map-page-title">'+z.name+'</h1><p class="map-page-subtitle">Нажмите на участок — увидите его цену и характеристики.</p><div class="workbench"><div class="map-panel"><div class="map-toolbar"><span class="map-heading">Выберите участок</span><span class="map-key"><span class="legend"><i class="dot available"></i> Свободен</span><span class="legend"><i class="dot booked"></i> Бронь</span><span class="legend"><i class="dot sold"></i> Продан</span></span></div><div class="map-canvas" id="mapCanvas"><div class="map-inner">'+svgMap(z)+'</div><div class="map-side-tag">'+z.place+' · демо-схема</div></div><div class="map-bottom"><label class="switch"><input type="checkbox" id="availableOnly" '+(state.availableOnly?'checked':'')+'> Выделить свободные</label><small>Карту можно листать вбок</small></div><div class="lot-list-head"><strong>Свободные участки</strong><small>'+filtered.length+' вариантов</small></div><div class="lot-grid">'+list+'</div></div><aside class="detail-panel" id="detailPanel">'+detail(z,lot)+'</aside></div></section>';
 document.getElementById("backZones").addEventListener("click",function(){showZones()});
 document.getElementById("availableOnly").addEventListener("change",function(e){state.availableOnly=e.target.checked;refreshSelection(false)});
 root.querySelectorAll("[data-lot]").forEach(function(el){
  el.addEventListener("click",function(){pickLot(el.dataset.lot)});
  el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pickLot(el.dataset.lot)}});
 });
 root.querySelectorAll("[data-lot-chip]").forEach(function(el){el.addEventListener("click",function(){pickLot(el.dataset.lotChip)})});
 var book=document.getElementById("bookLot");if(book)book.addEventListener("click",openModal);
}
function pickLot(id){var z=getZone(state.zoneId),l=getLot(z,id);if(!l)return;state.lotId=id;refreshSelection(true)}
function refreshSelection(scroll){
 var z=getZone(state.zoneId),l=getLot(z,state.lotId);
 document.querySelectorAll(".plot").forEach(function(p){var active=p.dataset.lot===l.id,meta=getLot(z,p.dataset.lot);p.classList.toggle("active",active);p.classList.toggle("filtered",(state.availableOnly&&meta.status!=="available")||(!sizeMatch(meta)&&answers.size!=="any"));var g=p.parentElement;g.querySelectorAll(".plot-num").forEach(function(n){n.classList.toggle("active",active);n.classList.toggle("filtered",(state.availableOnly&&meta.status!=="available")||(!sizeMatch(meta)&&answers.size!=="any"))})});
 document.getElementById("detailPanel").innerHTML=detail(z,l);
 root.querySelectorAll("[data-lot-chip]").forEach(function(e){e.classList.toggle("selected",e.dataset.lotChip===l.id)});
 var book=document.getElementById("bookLot");if(book)book.addEventListener("click",openModal);
 if(scroll&&window.innerWidth<1040){document.getElementById("detailPanel").scrollIntoView({behavior:"smooth",block:"start"})}
}
function openModal(){
 var z=getZone(state.zoneId),l=getLot(z,state.lotId);
 if(!z||!l||l.status!=="available")return;
 modalRoot.innerHTML='<div class="modal-back" id="modalBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button type="button" class="close" id="closeModal" aria-label="Закрыть">×</button><span class="eyebrow">LANDJER</span><h2 id="modalTitle">Просмотр участка</h2><p><strong>'+l.id+'</strong> · '+z.name+' · '+l.area+' соток · '+price(l.price)+'</p><form id="leadForm"><div class="form-field"><label for="nameInput">Ваше имя</label><input id="nameInput" required autocomplete="off" placeholder="Как к вам обращаться?"></div><div class="form-field"><label for="phoneInput">Номер телефона</label><input id="phoneInput" type="tel" required autocomplete="off" placeholder="+7 (___) ___-__-__"></div><button class="action-primary" type="submit">Записаться на просмотр</button></form><div class="demo-feedback" id="leadDone">Готово! Это демонстрация заявки — данные никуда не отправлены.</div><p style="font-size:12px">Это демонстрационный интерфейс. Не вводите реальные персональные данные.</p></div></div>';
 document.getElementById("closeModal").addEventListener("click",closeModal);
 document.getElementById("modalBack").addEventListener("click",function(e){if(e.target.id==="modalBack")closeModal()});
 document.getElementById("leadForm").addEventListener("submit",function(e){e.preventDefault();document.getElementById("leadDone").style.display="block";this.style.display="none"});
 document.getElementById("nameInput").focus();
}
function closeModal(){modalRoot.innerHTML=""}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
document.getElementById("navLots").addEventListener("click",function(){if(state.view==="map")showZones();else if(state.view==="zones")window.scrollTo({top:0,behavior:"smooth"});else {answers={purpose:"any",distance:"any",size:"any",timing:"later"};showZones()}});
document.getElementById("brandHome").addEventListener("click",function(e){e.preventDefault();restart()});
quiz();
})();
</script>
</body>
</html>
