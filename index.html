<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="brand-symbol">C</div><div><span class="brand-word">CAP <span style="color:var(--mint)">GROWTH QUEST</span></span><span class="small">ИНТЕРАКТИВНАЯ СТРАТЕГИЯ · КОНЦЕПТ</span></div></div><div class="topright"><span class="tiny-pill">KAZAKHSTAN / EDTECH</span><button type="button" id="restart" class="mini-btn" style="display:none">↻ Сначала</button></div></header>
<main id="game" class="game" aria-live="polite"></main>
<footer class="game-footer"><span>Независимый концепт развития образовательного продукта CAP Education.</span><span>Числа в экономической мини-игре — сценарные допущения, не прогноз компании.</span></footer>
</div><div id="toast" role="status" class="toast" aria-live="polite"></div>
<script>
'use strict';
const game=document.getElementById('game');
const restart=document.getElementById('restart');
const state={step:-1,found:new Set(),journey:{},chosen:null,connections:{},rewards:{},creators:20,clients:3,fee:1500};
const count=5;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ru-RU').format(n);
let toastTimer;
function toast(message){const e=document.getElementById('toast');e.textContent=message;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2200)}
function btnNext(label='Следующая миссия →'){return `<button class="btn-primary" data-next ${!done()?'disabled':''}>${label}</button>`;}
function done(){if(state.step===0)return state.found.size===3;if(state.step===1)return Object.keys(state.journey).length===5;if(state.step===2)return Object.keys(state.connections).length===4;if(state.step===3)return Object.keys(state.rewards).length===4;if(state.step===4)return state.creators*state.clients>=100 && state.fee<=1500;return false}
function hud(label){return `<div class="level-hud"><div class="level-eyebrow">${label}</div><div class="hud-right"><div class="level-count">МИССИЯ ${state.step+1} / ${count}</div><div class="progress-track"><div class="progress-fill" style="width:${(state.step/count)*100}%"></div></div></div></div>`}
function frame({label,title,sub,board,side,footer,wide=false}){
  game.innerHTML=`<div class="game-inner">${hud(label)}<h2 class="screen-title">${title}</h2><p class="screen-sub">${sub}</p><div class="quest-body ${wide?'single':''}"><section class="quest-board">${board}</section>${side?`<aside class="quest-side">${side}</aside>`:''}</div><div class="bottom-row"><div class="foot-note">${footer||'Экспериментальная игровая концепция. Каждая механика иллюстрирует реальную гипотезу роста.'}</div>${btnNext(state.step===count-1?'Открыть стратегию →':'Продолжить →')}</div></div>`;
  game.querySelector('[data-next]').addEventListener('click',next);
  restart.style.display='block';
}
function scrollTopGame(){window.scrollTo({top:0,behavior:'smooth'})}
function next(){if(!done())return;state.step++;render();scrollTopGame()}
function reset(){state.step=-1;state.found.clear();state.journey={};state.chosen=null;state.connections={};state.rewards={};state.creators=20;state.clients=3;state.fee=1500;render();scrollTopGame()}
restart.addEventListener('click',reset);
function render(){if(state.step===-1)intro();else if(state.step===0)classroom();else if(state.step===1)journey();else if(state.step===2)wires();else if(state.step===3)reward();else if(state.step===4)economy();else finale()}
function intro(){restart.style.display='none';game.innerHTML=`<div class="game-inner"><div class="hero"><div class="hero-copy"><div class="story-badge"><span class="dot"></span>Визуальная новелла · 5 мини-миссий</div><h1>Школа идёт дальше.<br><span style="color:var(--mint)">А ребёнок не понял.</span></h1><p class="lead">Вы — IT-специалист в Казахстане. У вас появляется идея: помочь школьникам находить пробелы в знаниях и разбираться именно в тех темах, где они отстали.</p><p class="lead" style="margin-top:9px">Не выращивать вундеркиндов. А сделать базовые знания понятнее — для каждого ребёнка.</p><div class="hero-note">Вы собираете продукт с нуля. <strong>Каждое действие раскрывает часть стратегии его роста.</strong></div><div class="cta-row"><button class="btn-primary" id="start">Начать игру ↗</button><button class="btn-secondary" id="open-plan">Сразу посмотреть план</button></div><p class="meta-note">5 минут · Поиск предметов · Drag & Drop · Соединение линий · Игровая экономика</p></div><div class="hero-art" aria-hidden="true"><div class="orb"><span class="orb-core">🧩</span></div><div class="float-card fc1">Пробел в знаниях<br><b>обнаружен</b></div><div class="float-card fc2">Персональный путь<br><b>создан ✓</b></div><div class="float-card fc3">Прогресс ученика<br><b>+1 тема</b></div></div></div></div>`;document.getElementById('start').addEventListener('click',()=>{state.step=0;render();scrollTopGame()});document.getElementById('open-plan').addEventListener('click',()=>{state.step=5;render();scrollTopGame()});}

function classroom(){const names={board:'Новая тема без понимания',notebook:'Вопрос остался без ответа',test:'Ошибки повторяются'};frame({label:'01 / НАЙДИТЕ ПРОБЛЕМУ',title:'Начните не с рекламы. <em>С проблемы.</em>',sub:'Вы оказались в школьном классе. Найдите три подсказки, показывающие, почему ребёнку бывает трудно идти в темпе программы.',board:`<div class="classroom">${classroomSVG()}</div><div class="found-labels">${Object.entries(names).map(([id,name])=>`<span class="found-pill ${state.found.has(id)?'hit':''}">${state.found.has(id)?'✓':'○'} ${name}</span>`).join('')}</div>`,side:`<div class="side-tag">Поиск предметов</div><h3>Осмотрите класс</h3><p>Нажмите на пример на доске, тетрадь с вопросом и проверочную работу с ошибками.</p><p class="item-count">Найдено: ${state.found.size} из 3</p><div class="lesson"><strong>Стратегическая идея</strong>Не делать из каждого ребёнка вундеркинда. Сначала выявлять пробелы, затем помогать закрывать их по конкретным темам.</div>${done()?'<div class="feedback"><span class="tick">✓</span> Проблема сформулирована</div>':''}`,footer:'Ценностное предложение: конкретный учебный пробел → понятное решение, а не бесконечный каталог уроков.'});game.querySelectorAll('[data-clue]').forEach(el=>{const activate=()=>{if(!state.found.has(el.dataset.clue)){state.found.add(el.dataset.clue);classroom();if(done())toast('Проблема найдена! Вы можете продолжить.')}};el.addEventListener('click',activate);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}})})}
// Shared pointer-aware dragging with tap-to-place fallback, for both desktop and mobile.
function bindDragCards(cardSelector,onDrop,onTap){game.querySelectorAll(cardSelector).forEach(card=>{
  card.addEventListener('pointerdown',e=>{if(e.button!==0)return;const id=card.dataset.token;const start={x:e.clientX,y:e.clientY};let moved=false;let ghost=null;let live=true;card.setPointerCapture?.(e.pointerId);
    const move=ev=>{if(!live)return;const dx=ev.clientX-start.x,dy=ev.clientY-start.y;if(!moved&&Math.hypot(dx,dy)>8){moved=true;ghost=card.cloneNode(true);ghost.classList.add('drag-ghost');ghost.removeAttribute('id');ghost.setAttribute('aria-hidden','true');document.body.appendChild(ghost)}if(moved&&ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop]');game.querySelectorAll('.dragover').forEach(e=>e.classList.remove('dragover'));if(target)target.classList.add('dragover')}};
    const finish=ev=>{if(!live)return;live=false;card.removeEventListener('pointermove',move);card.removeEventListener('pointerup',finish);card.removeEventListener('pointercancel',cancel);ghost?.remove();game.querySelectorAll('.dragover').forEach(e=>e.classList.remove('dragover'));if(moved){const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-drop]');if(target){onDrop(id,target.dataset.drop);return}toast('Перетащите карточку в нужную область')}else onTap(id)};
    const cancel=()=>{live=false;ghost?.remove();game.querySelectorAll('.dragover').forEach(e=>e.classList.remove('dragover'))};card.addEventListener('pointermove',move);card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',cancel);
  });card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap(card.dataset.token)}})
});}

const journeySlots=[['Что именно непонятно?','Быстрая проверка конкретной темы'],['Где образовался пробел?','Персональная карта знаний'],['Как ребёнку разобраться?','Видео, метафора или мини-урок'],['Получилось ли применить?','Несколько заданий для закрепления'],['Что увидит родитель?','Понятный результат и следующий шаг']];
function journey(){const order=['report','explain','diagnostic','practice','map'];const items=order.filter(id=>!Object.values(state.journey).includes(id));frame({label:'02 / СОБЕРИТЕ ПРОДУКТ',title:'Теперь соберите <em>путь ученика.</em>',sub:'Продукт должен вести ребёнка от непонимания к результату. Перетащите этапы на свои места. На телефоне можно нажать карточку, затем ячейку.',board:`<div class="sort-wrap"><div class="sort-heading">Карточки механик</div><div class="tokens">${items.map(id=>{const x=journeyItems.find(x=>x.id===id);return `<button type="button" class="draggable ${state.chosen===id?'selected':''}" data-token="${id}"><span>${x.icon}</span> ${x.label}</button>`}).join('')||'<div style="color:var(--mint);padding:10px">Все пять этапов на месте ✓</div>'}</div><div class="sort-heading">Учебный маршрут</div><div class="slots">${journeySlots.map(([title,desc],i)=>`<div class="slot" role="button" tabindex="0" data-drop="${i}"><span class="slot-num">${i+1}</span><div class="slot-desc"><strong>${title}</strong>${desc}</div>${state.journey[i]?`<span class="placed">✓ ${safe(journeyItems.find(x=>x.id===state.journey[i]).label)}</span>`:'<span class="arrow-slot">＋</span>'}</div>`).join('')}</div></div>`,side:`<div class="side-tag">Drag & Drop</div><h3>Продуктовая логика</h3><p>Вместо «видео по всем предметам» — понятный маршрут по конкретной трудности.</p><p class="item-count">Маршрут: ${Object.keys(state.journey).length} / 5</p><div class="lesson"><strong>Что получает бизнес</strong>Активацию после первого полезного опыта, а не только регистрацию. На старте — пилот по 1–2 предметам, проверка качества диагностики методистами.</div>${done()?'<div class="feedback"><span class="tick">✓</span> Маршрут готов</div>':''}`,footer:'Ключевая воронка: диагностика → карта пробелов → объяснение → практика → доказанный прогресс.'});
  const place=(id,slot)=>{const idx=Number(slot);if(state.journey[idx]){toast('Здесь этап уже установлен');return}if(journeyItems[idx].id!==id){toast('Пока не подходит. Сверьтесь с подсказкой у ячейки.');const el=game.querySelector(`[data-drop="${idx}"]`);el?.classList.add('wrong');setTimeout(()=>el?.classList.remove('wrong'),380);return}state.journey[idx]=id;state.chosen=null;journey();if(done())toast('Отлично! Продуктовый маршрут собран.')};
  const pick=id=>{state.chosen=state.chosen===id?null:id;game.querySelectorAll('[data-token]').forEach(e=>e.classList.toggle('selected',e.dataset.token===state.chosen));if(state.chosen)toast('Теперь коснитесь подходящей ячейки')};
  bindDragCards('.draggable',place,pick);
  game.querySelectorAll('[data-drop]').forEach(e=>{e.addEventListener('click',()=>{if(state.chosen)place(state.chosen,e.dataset.drop)});e.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&state.chosen){ev.preventDefault();place(state.chosen,e.dataset.drop)}})});
}

const targets=[{id:'traffic',icon:'📣',name:'Релевантные охваты',extra:'Интерес к теме + тест'},{id:'trust',icon:'💚',name:'Доверие родителей',extra:'Доказательства результата'},{id:'clarity',icon:'🧠',name:'Понять сложную тему',extra:'Объяснить, а не развлечь'},{id:'recommend',icon:'🔗',name:'Оплаченные рекомендации',extra:'Партнёрская атрибуция'}];
function wires(){frame({label:'03 / ПРОВЕДИТЕ СИГНАЛ',title:'Контент должен <em>работать на задачу.</em>',sub:'Соедините каждую маркетинговую механику с её главным результатом. Нажмите узел слева и узел справа — или протяните между ними кабель.',board:`<div class="connect-wrap"><div class="wire-stage" id="wire-stage"><svg class="lines" id="wires-svg" aria-hidden="true"></svg><div class="wire-col">${sources.map(x=>`<button type="button" class="wire-node left ${state.connections[x.id]?'matched':''}" data-source="${x.id}"><span class="emoji">${x.icon}</span><span>${x.name}<small>${x.extra}</small></span><i class="socket"></i></button>`).join('')}</div><div class="wire-col">${targets.map(x=>`<button type="button" class="wire-node right ${Object.values(state.connections).includes(x.id)?'matched':''}" data-target="${x.id}"><i class="socket"></i><span class="emoji">${x.icon}</span><span>${x.name}<small>${x.extra}</small></span></button>`).join('')}</div></div></div><div class="board-status">Соединено: <strong style="color:var(--mint)">${Object.keys(state.connections).length} / 4</strong> цепочек</div>`,side:`<div class="side-tag">Кабельная схема</div><h3>Контентная система</h3><p>Одна медийная экосистема, но задачи контента разные: помогать понять, привлекать, укреплять доверие и приводить новых клиентов.</p><div class="lesson"><strong>Проверка гипотез</strong>Запустить короткие образовательные рубрики, пилот AI-мультсериала и тест 15–20 взрослых UGC-амбассадоров. Мерить не одни просмотры, а путь до регистрации и оплаты.</div>${done()?'<div class="feedback"><span class="tick">✓</span> Все связи работают</div>':''}`,footer:'Не превращаем 4 канала в 4 отдельных бизнеса. Все должны приводить к диагностике и обучению.'});
  const stage=game.querySelector('#wire-stage');let picked=null,dragging=false,dragStart=null;
  const sourceBtn=id=>stage.querySelector(`[data-source="${id}"]`);
  const center=(el,side)=>{const r=stage.getBoundingClientRect(),s=el.querySelector('.socket').getBoundingClientRect();return {x:s.left+s.width/2-r.left,y:s.top+s.height/2-r.top}};
  const wirePath=(a,b)=>`M ${a.x} ${a.y} C ${a.x+(b.x-a.x)*.53} ${a.y}, ${b.x-(b.x-a.x)*.53} ${b.y}, ${b.x} ${b.y}`;
  const paint=(preview=null)=>{const svg=stage.querySelector('#wires-svg');if(!svg)return;svg.setAttribute('viewBox',`0 0 ${stage.clientWidth} ${stage.clientHeight}`);let paths='';for(const [from,to]of Object.entries(state.connections)){const a=center(sourceBtn(from));const b=center(stage.querySelector(`[data-target="${to}"]`));paths+=`<path d="${wirePath(a,b)}"/>`}if(preview&&preview.id){const a=center(sourceBtn(preview.id));paths+=`<path class="preview" d="${wirePath(a,{x:preview.x,y:preview.y})}"/>`}svg.innerHTML=paths;};
  const select=id=>{if(state.connections[id])return;picked=id;stage.querySelectorAll('[data-source]').forEach(e=>e.classList.toggle('active',e.dataset.source===id));paint();};
  const connect=to=>{if(!picked){toast('Сначала выберите источник слева');return}const source=sources.find(s=>s.id===picked);if(source.target!==to){toast('Связь не подходит — попробуйте другую цель');return}if(Object.values(state.connections).includes(to)){toast('Эта цель уже связана');return}state.connections[picked]=to;picked=null;wires();if(done())toast('Все цепочки соединены!')};
  stage.querySelectorAll('[data-source]').forEach(el=>{el.addEventListener('pointerdown',e=>{if(e.button!==0||state.connections[el.dataset.source])return;dragging=false;dragStart={x:e.clientX,y:e.clientY,id:el.dataset.source};select(el.dataset.source);el.setPointerCapture?.(e.pointerId)});el.addEventListener('pointermove',e=>{if(!dragStart)return;const rect=stage.getBoundingClientRect();if(Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>7)dragging=true;if(dragging)paint({id:dragStart.id,x:e.clientX-rect.left,y:e.clientY-rect.top})});el.addEventListener('pointerup',e=>{if(!dragStart)return;const was=dragging;dragStart=null;if(was){const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-target]');if(target)connect(target.dataset.target);else paint()}});el.addEventListener('pointercancel',()=>{dragStart=null;paint()});el.addEventListener('click',()=>select(el.dataset.source))});
  stage.querySelectorAll('[data-target]').forEach(el=>el.addEventListener('click',()=>connect(el.dataset.target)));
  paint();requestAnimationFrame(()=>paint());
  if(typeof ResizeObserver!=='undefined'){const ro=new ResizeObserver(()=>{if(stage.isConnected)paint();else ro.disconnect()});ro.observe(stage)}
}
// Scene 4: drag programme elements to separate children and parents.
const rewardItems=[{id:'cash',label:'Комиссия за платящую семью',icon:'💸',group:'parent'},{id:'coins',label:'100 монет за друга',icon:'🪙',group:'child'},{id:'progress',label:'Монеты за учебный прогресс',icon:'🏅',group:'child'},{id:'ugc',label:'UGC-ролики и кейсы',icon:'🎥',group:'parent'}];
function reward(){const order=['cash','coins','ugc','progress'];const remaining=order.filter(id=>!state.rewards[id]);frame({label:'04 / ЗАПУСТИТЕ РЕКОМЕНДАЦИИ',title:'У ребёнка и родителя — <em>разные стимулы.</em>',sub:'Разложите механики на два контура роста. Ученикам — игровая мотивация, взрослым — партнёрская программа с реальными выплатами.',board:`<div class="sort-wrap"><div class="sort-heading">Перетащите механики</div><div class="tokens">${remaining.map(id=>{const x=rewardItems.find(x=>x.id===id);return `<button class="draggable ${state.chosen===id?'selected':''}" type="button" data-token="${id}">${x.icon} ${x.label}</button>`}).join('')||'<div style="padding:10px;color:var(--mint)">Все механики распределены ✓</div>'}</div><div class="reward-zones"><div class="reward-zone" role="button" tabindex="0" data-drop="child"><strong>🧑‍🎓 Ученики</strong><small>Делятся ссылкой с друзьями. Награды внутри сервиса.</small><div class="zone-chips">${Object.entries(state.rewards).filter(([id,v])=>v==='child').map(([id])=>`<div class="zone-chip">✓ ${rewardItems.find(x=>x.id===id).label}</div>`).join('')}</div></div><div class="reward-zone" role="button" tabindex="0" data-drop="parent"><strong>👩‍👧 Родители</strong><small>Делятся реальным опытом. Комиссия и контент по отдельным условиям.</small><div class="zone-chips">${Object.entries(state.rewards).filter(([id,v])=>v==='parent').map(([id])=>`<div class="zone-chip">✓ ${rewardItems.find(x=>x.id===id).label}</div>`).join('')}</div></div></div></div>`,side:`<div class="side-tag">Два growth loop</div><h3>Без детского рекламного UGC</h3><p>Ребёнок приглашает друга. Когда родитель друга оплачивает обучение и проходит проверка транзакции — начисляются монеты. За одного нового платящего клиента — одно вознаграждение.</p><div class="lesson"><strong>Родителям</strong>UGC и партнёрские рекомендации, отдельный учёт затрат. Договоры, маркировка рекламы, модерация и корректные массовые выплаты.</div>${done()?'<div class="feedback"><span class="tick">✓</span> Программы разделены</div>':''}`,footer:'Важны родительские согласия, антифрод, проверка новых семей, платёжный статус и правомерность выплат.'});
  const place=(id,group)=>{const item=rewardItems.find(x=>x.id===id);if(item.group!==group){toast('Это другой тип вознаграждения — попробуйте другой контур');const target=game.querySelector(`[data-drop="${group}"]`);target.classList.add('wrong');setTimeout(()=>target?.classList.remove('wrong'),350);return}state.rewards[id]=group;state.chosen=null;reward();if(done())toast('Два контура рекомендаций собраны!')};
  const pick=id=>{state.chosen=state.chosen===id?null:id;game.querySelectorAll('[data-token]').forEach(e=>e.classList.toggle('selected',e.dataset.token===state.chosen));if(state.chosen)toast('Теперь нажмите на ученика или родителя')};
  bindDragCards('.draggable',place,pick);game.querySelectorAll('[data-drop]').forEach(e=>{e.addEventListener('click',()=>{if(state.chosen)place(state.chosen,e.dataset.drop)});e.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&state.chosen){ev.preventDefault();place(state.chosen,e.dataset.drop)}})})
}
// Scene 5: an intentionally simplified, labeled hypothesis sandbox.
function economy(){const paid=state.creators*state.clients,rev=paid*10000,payout=paid*state.fee,ratio=state.fee/100;const ok=done();frame({label:'05 / УПРАВЛЯЙТЕ ЭКОНОМИКОЙ',title:'Идея должна <em>сходиться в цифрах.</em>',sub:'Управляйте тремя рычагами партнёрской программы. Цель: 100 новых платящих семей при вознаграждении не выше 15% первой выручки.',board:`<div class="sim-wrap"><div class="sim-grid"><div class="controls"><div class="control"><label for="creators">Активные мамы-амбассадоры <span id="v-creators">${state.creators}</span></label><input type="range" id="creators" min="10" max="50" step="5" value="${state.creators}"><div class="range-ends"><span>10 авторов</span><span>50 авторов</span></div></div><div class="control"><label for="clients">Оплат на одного автора <span id="v-clients">${state.clients}</span></label><input type="range" id="clients" min="1" max="6" step="1" value="${state.clients}"><div class="range-ends"><span>1 семья</span><span>6 семей</span></div></div><div class="control"><label for="fee">Вознаграждение за первую оплату <span id="v-fee">${fmt(state.fee)} ₸</span></label><input type="range" id="fee" min="500" max="2000" step="250" value="${state.fee}"><div class="range-ends"><span>500 ₸</span><span>2 000 ₸</span></div></div><p class="foot-note">Все конверсии в этой комнате условные. Для реального бюджета потребуются данные CAC, маржи, возвратов и LTV.</p></div><div class="sim-readout"><div><div class="small-label">Первые платящие семьи</div><div class="big" id="paid">${fmt(paid)}</div><div class="small-label">Цель: минимум 100</div></div><div class="sim-stats"><div><strong id="revenue">${fmt(rev)} ₸</strong><span>Первая выручка</span></div><div><strong id="payout">${fmt(payout)} ₸</strong><span>Вознаграждения</span></div><div><strong id="ratio">${ratio}%</strong><span>Доля от первых оплат</span></div><div><strong>10 000 ₸</strong><span>Цена одного предмета / мес.</span></div></div></div></div></div><div class="sim-goal"><span>Условия: ≥100 оплат · вознаграждение ≤15% первой выручки</span><strong id="sim-status" class="check-status ${ok?'ok':''}">${ok?'✓ Модель сбалансирована':'◉ Настройте показатели'}</strong></div>`,side:`<div class="side-tag">Проверка экономики</div><h3>Начать с малого</h3><p>В реальности я бы запустил пилот на 15–20 взрослых авторах и отдельно оценивал стоимость UGC, подтверждённые покупки, возвраты и последующие продления.</p><div class="lesson"><strong>Ключевой вывод</strong>100 амбассадоров — это цель масштабирования после пилота, а не стартовый рекламный бюджет. Перевод денег взрослым партнёрам требует договорной, налоговой и платёжной модели.</div>${ok?'<div class="feedback"><span class="tick">✓</span> Игровая цель выполнена</div>':''}`,footer:'Это мини-симулятор, не обещание реальных результатов. Число новых покупок = авторы × оплаты на автора.'});
  ['creators','clients','fee'].forEach(id=>game.querySelector('#'+id).addEventListener('input',e=>{state[id]=Number(e.target.value);const paid=state.creators*state.clients,rev=paid*10000,payout=paid*state.fee;game.querySelector('#v-creators').textContent=state.creators;game.querySelector('#v-clients').textContent=state.clients;game.querySelector('#v-fee').textContent=fmt(state.fee)+' ₸';game.querySelector('#paid').textContent=fmt(paid);game.querySelector('#revenue').textContent=fmt(rev)+' ₸';game.querySelector('#payout').textContent=fmt(payout)+' ₸';game.querySelector('#ratio').textContent=(state.fee/100)+'%';const ok=done();game.querySelector('#sim-status').className='check-status '+(ok?'ok':'');game.querySelector('#sim-status').textContent=ok?'✓ Модель сбалансирована':'◉ Настройте показатели';game.querySelector('[data-next]').disabled=!ok;if(ok&&!game.querySelector('[data-next]').dataset.celebrated){game.querySelector('[data-next]').dataset.celebrated='1';toast('Экономика прошла игровой тест. Открывайте стратегию!')}}))
}
function finale(){restart.style.display='block';game.innerHTML=`<div class="end-wrap"><div class="end-top"><span class="end-orb">🚀</span><span class="story-badge" style="margin:0"><span class="dot"></span>МИССИЯ ВЫПОЛНЕНА · ПЛАН НА 90 ДНЕЙ</span></div><h2 class="screen-title">Вы не просто запустили рекламу.<br><em>Вы собрали систему роста.</em></h2><p class="screen-sub" style="max-width:980px">Суть стратегии: школьник быстро находит пробел в теме, получает понятное объяснение и видит прогресс. Маркетинг приводит релевантные семьи, а обучение и рекомендации помогают удерживать их.</p><div class="plan-grid"><article class="plan-card"><div class="period">0–30 дней / Проверить</div><h3>Проблема и MVP</h3><p>Аудит маркетинга и CRM. Исследование родителей. Пилот <b>1–2 предметов</b>. Быстрая диагностика и учебный маршрут. Первые Reels / Shorts и прототип AI-мультсериала.</p></article><article class="plan-card"><div class="period">31–60 дней / Запустить</div><h3>Трафик и доверие</h3><p>Контент-система: разборы ошибок, кейсы семей, экспертные видео. Пилот <b>15–20 мам-амбассадоров</b>. Отдельный детский «пригласи друга» с монетами после реальной покупки.</p></article><article class="plan-card"><div class="period">61–90 дней / Усилить</div><h3>Экономика и удержание</h3><p>Масштабирование каналов по CAC и конверсии в оплату. Антифрод и автоматизация рефералов. Регулярный прогресс ученика и отчёт родителю. Анализ <b>retention, churn и LTV</b>.</p></article></div><div class="loop">ДИАГНОСТИКА → ПОНЯТНОЕ ОБЪЯСНЕНИЕ → ПРОГРЕСС → ДОВЕРИЕ РОДИТЕЛЯ → ПРОДЛЕНИЕ → РЕКОМЕНДАЦИЯ</div><div class="stamp">Первые гипотезы для обсуждения с командой CAP Education</div><div class="cta-row"><button type="button" class="btn-primary" id="again">Пройти игру ещё раз ↻</button><button type="button" class="btn-secondary" id="copy">Скопировать план</button></div><p class="foot-caution">Важно: этот концепт не подменяет аудит действующих продуктов CAP Education / ALFA Z. Числовые цели, команда, бюджет и сроки реализации требуют проверки после доступа к данным и возможностям продукта. Для рекламы и рефералов с участием несовершеннолетних необходима отдельная юридическая проверка.</p></div>`;game.querySelector('#again').addEventListener('click',reset);game.querySelector('#copy').addEventListener('click',()=>{const content=`CAP Growth Quest — концепция запуска\n\n0–30 дней: аудит маркетинга/CRM, изучение родителей, MVP по 1–2 предметам, диагностика, короткий контент, AI-мультсериал (пилот).\n31–60 дней: контентная система, тест 15–20 мам-амбассадоров и детская реферальная программа за подтвержденные покупки.\n61–90 дней: масштабирование каналов по CAC, антифрод, удержание, отчеты о прогрессе, LTV.\n\nЦикл роста: диагностика → объяснение → прогресс → доверие → продление → рекомендация.\n\nЭто предварительная стратегия; KPI и бюджеты уточняются по данным.`;const b=game.querySelector('#copy');const fallback=()=>{const t=document.createElement('textarea');t.value=content;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();b.textContent=ok?'Скопировано ✓':'Копирование недоступно'};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(content).then(()=>b.textContent='Скопировано ✓').catch(fallback);else fallback()})}
render();
</script>
